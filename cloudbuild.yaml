steps:
# Build backend image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'gcr.io/$PROJECT_ID/cinepilot-backend:$COMMIT_SHA', '-f', 'backend.Dockerfile', '.']

- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/cinepilot-backend:$COMMIT_SHA']

# Deploy backend to Cloud Run and inject Secret Manager secrets
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      set -e
      # Deploy backend
      gcloud run deploy cinepilot-backend \
        --image gcr.io/$PROJECT_ID/cinepilot-backend:$COMMIT_SHA \
        --region us-central1 \
        --platform managed \
        --allow-unauthenticated \
        --set-env-vars=PORT=8080 \
        --update-secrets=GEMINI_API_KEY=projects/$PROJECT_ID/secrets/GEMINI_API_KEY:latest,CLICKHOUSE_PASSWORD=projects/$PROJECT_ID/secrets/CLICKHOUSE_PASSWORD:latest

# Capture backend URL
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      BACKEND_URL=$(gcloud run services describe cinepilot-backend --region us-central1 --platform managed --format='value(status.url)')
      echo "BACKEND_URL=${BACKEND_URL}"
      # Build frontend image with NEXT_PUBLIC_API_BASE_URL pointing to backend
      docker build -t gcr.io/$PROJECT_ID/cinepilot-frontend:$COMMIT_SHA -f frontend/Dockerfile --build-arg NEXT_PUBLIC_API_BASE_URL=${BACKEND_URL} .
      docker push gcr.io/$PROJECT_ID/cinepilot-frontend:$COMMIT_SHA

# Deploy frontend to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: 'bash'
  args:
    - '-c'
    - |
      BACKEND_URL=$(gcloud run services describe cinepilot-backend --region us-central1 --platform managed --format='value(status.url)')
      gcloud run deploy cinepilot-frontend \
        --image gcr.io/$PROJECT_ID/cinepilot-frontend:$COMMIT_SHA \
        --region us-central1 \
        --platform managed \
        --allow-unauthenticated \
        --set-env-vars=NEXT_PUBLIC_API_BASE_URL=${BACKEND_URL}

images:
- 'gcr.io/$PROJECT_ID/cinepilot-backend:$COMMIT_SHA'
- 'gcr.io/$PROJECT_ID/cinepilot-frontend:$COMMIT_SHA'

timeout: '1200s'
