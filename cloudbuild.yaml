steps:
  # 1. Build and Push Backend
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/cinepilot-backend', '-f', 'backend.Dockerfile', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cinepilot-backend']

  # 2. Deploy Backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cinepilot-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cinepilot-backend'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'
      - '--set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,CLICKHOUSE_HOST=CLICKHOUSE_HOST:latest,CLICKHOUSE_USER=CLICKHOUSE_USER:latest,CLICKHOUSE_PASSWORD=CLICKHOUSE_PASSWORD:latest'

  # 2.5. Fetch Backend URL and save it to a temporary file
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run services describe cinepilot-backend --region us-central1 --format 'value(status.url)' > backend_url.txt

  # 3. Build and Push Frontend (reading the URL from the file)
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BACKEND_URL=$$(cat backend_url.txt)
        docker build --build-arg NEXT_PUBLIC_API_BASE_URL=$$BACKEND_URL -t gcr.io/$PROJECT_ID/cinepilot-frontend -f frontend/Dockerfile ./frontend

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/cinepilot-frontend']

  # 4. Deploy Frontend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'cinepilot-frontend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/cinepilot-frontend'
      - '--region'
      - 'us-central1'
      - '--allow-unauthenticated'