[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinepilot-ai"
version = "0.1.0"
description = "Autonomous Film Production Intelligence Agent"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    {name = "Ibrahima", email = "kandia195@gmail.com"}
]
license = {text = "MIT"}

dependencies = [
    "google-adk==2.5.0",
    "google-genai>=0.5.0",
    "clickhouse-connect>=0.8.0",
    "mcp-clickhouse>=0.4.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[tool.setuptools]
packages = ["agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"